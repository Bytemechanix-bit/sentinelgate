name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check sentinelgate tests
      - name: Security scan
        run: bandit -q -r sentinelgate
      - name: Test
        run: pytest -q -m "not integration"
      - name: Validate example policy
        run: sentinelgate validate policies/example.yaml --fail-on-conflict
      - name: Conflict check
        run: sentinelgate conflicts policies/example.yaml
      - name: Render example policy
        run: sentinelgate render policies/example.yaml
      - name: Simulate with timestamped audit trail
        run: sentinelgate simulate policies/example.yaml --json-output --audit-log /tmp/sentinelgate-audit.jsonl

  linux-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install nftables
        run: sudo apt-get update && sudo apt-get install -y nftables
      - name: Install package + test dependencies
        run: pip install -e ".[dev]"
      - name: Validate generated ruleset with real nftables
        run: sudo -E pytest -q -m integration
