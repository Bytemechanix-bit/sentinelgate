name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check sentinelgate tests
      - name: Security scan
        run: bandit -q -r sentinelgate
      - name: Test
        run: pytest -q
      - name: Validate example policy
        run: sentinelgate validate policies/example.yaml
      - name: Render example policy
        run: sentinelgate render policies/example.yaml
      - name: Simulate example policy
        run: sentinelgate simulate policies/example.yaml --json-output
